<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | MyBudget</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/login.css">
</head>
<body>
  <main class="login-wrap">
    <section class="login-card">
      <div class="logo">🎀</div>
      <h1>MyBudget</h1>
      <p>Create your account to start tracking expenses 💗</p>
      <form id="authForm"><p id="authError" role="alert" style="color:#b01862;"></p>
        <label>Name
          <input type="text" name="name" placeholder="Enter your name" required>
        </label>

        <label>Email
          <input type="email" name="email" placeholder="Enter your email" required>
        </label>

        <label>Password
          <input type="password" name="password" minlength="8" placeholder="Enter your password" required>
        </label>

        <button type="submit">Register ✨</button>
        <small>Already have an account? <a href="login.html">Login here</a></small>
      </form>
    </section>

    <section class="art">
      <h2>Track your money like a princess 👑</h2>
      <div class="floating">🌸 🦋 💗 ✨</div>
    </section>
  </main>
<script src="assets/auth.js"></script>
<script src="assets/register.js"></script>
</body>
</html>
